[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prefscript"
dynamic = ["version"]
authors = [
    { name = "José Luis Balcázar", email = "jose.luis.balcazar@upc.edu" }
]
description = "Partial Recursive Functions for Scripting"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "lark>=1.3.1",
    "pytokr>=1.2.1",
    "cantorpairs>=1.3.1",
]

[project.urls]
"Homepage" = "https://github.com/balqui/prefscript"
"Bug Tracker" = "https://github.com/balqui/prefscript/issues"

[project.scripts]
prefscript = "prefscript.prefscript:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prefscript = [
    "stdprfs/*.prfs",
    "examples/*.prfs",
]

[tool.setuptools.dynamic]
version = {attr = "prefscript._version.__version__"}
